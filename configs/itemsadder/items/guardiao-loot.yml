# ============================================
# ITENS DO BOSS - GUARDIÃO CORROMPIDO
# Catacumbas do Véu Rasgado (Tier 1)
# ============================================
#
# CONVENÇÃO DE IDs: snake_case minúsculo, sem acentos.
# O ItemsAdder exige nomes de arquivo e IDs em minúsculo, sem espaços
# nem caracteres especiais. O arquivo foi renomeado de
# "guardião-loot.yml" para "guardiao-loot.yml" por esse motivo.
#
# Referenciado em:
#   - configs/mythicmobs/bosses/guardiao-corrompido.yml (Drops)
#   - configs/itemsadder/items/high-tier-items.yml (receitas usam
#     fragmento_veu_rasgado como ingrediente)
# ============================================

info:
  namespace: minecraftsoul
  version: "1.0"

items:

  # ------------------------------
  # LÂMINA DO VÉU CORROMPIDO
  # Arma melee híbrida - Escala com Força + Inteligência
  # ------------------------------
  lamina_veu_corrompido:
    display_name: "&5&lLâmina do Véu Corrompido"
    material: NETHERITE_SWORD
    lore:
      - "&7Uma lâmina forjada com a essência do Véu rasgado."
      - "&7Causa dano adicional baseado em Força e Inteligência."
      - ""
      - "&eRequisitos:"
      - "&7  Força: &c12"
      - "&7  Inteligência: &c10"
      - ""
      - "&aBônus de Atributos:"
      - "&7  +12% Dano Melee (escala com Força)"
      - "&7  +8% Dano Mágico (escala com Inteligência)"
      - "&7  Chance de aplicar \"Queimadura de Alma\" (DoT)"
    # attribute_modifiers exige aninhamento por SLOT (mainhand/offhand/
    # head/chest/legs/feet) com nomes em camelCase.
    attribute_modifiers:
      mainhand:
        attackDamage: 9.5
        attackSpeed: 1.6
    item_flags:
      - HIDE_ATTRIBUTES
    # Requisito de atributo é aplicado via AuraSkills/Skript (lore é só visual)

  # ------------------------------
  # ELMO DO GUARDIÃO CORROMPIDO
  # Peça de armadura tanque - Foco em Constituição
  # ------------------------------
  elmo_guardiao_corrompido:
    display_name: "&5&lElmo do Guardião Corrompido"
    material: NETHERITE_HELMET
    lore:
      - "&7Protege a mente contra a corrupção do Véu."
      - ""
      - "&eRequisitos:"
      - "&7  Constituição: &c14"
      - ""
      - "&aBônus de Atributos:"
      - "&7  +45 Vida Máxima"
      - "&7  +8% Resistência a Dano Mágico"
      - "&7  +5 Sabedoria"
    attribute_modifiers:
      head:
        armor: 4.0
        armorToughness: 2.0
    item_flags:
      - HIDE_ATTRIBUTES

  # ------------------------------
  # FRAGMENTO DO VÉU RASGADO
  # Material de crafting raro - Drop principal
  # Usado como ingrediente nas receitas de high-tier-items.yml
  # ------------------------------
  fragmento_veu_rasgado:
    display_name: "&d&lFragmento do Véu Rasgado"
    material: NETHER_STAR
    lore:
      - "&7Um pedaço do Véu que foi rasgado."
      - "&7Pode ser usado para forjar equipamentos lendários."
      - ""
      - "&6Raro - Drop do Guardião Corrompido"
      - "&7Quantidade dropada: 1~3"
    item_flags:
      - HIDE_ATTRIBUTES

  # ------------------------------
  # ANEL DA ALMA PRESA (Acessório)
  # ------------------------------
  anel_alma_presa:
    display_name: "&5&lAnel da Alma Presa"
    material: NETHERITE_INGOT
    lore:
      - "&7Um anel que prende fragmentos de almas corrompidas."
      - ""
      - "&eEfeito Passivo:"
      - "&7  +6% Dano contra mobs corrompidos"
      - "&7  +4 Inteligência"
      - "&7  +3 Sabedoria"
    item_flags:
      - HIDE_ATTRIBUTES
