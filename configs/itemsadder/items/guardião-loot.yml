  material: NETHERITE_SWORD
  itemflags: [HIDE_ATTRIBUTES]
  attributes:
    attackDamage: 9.5
    attackSpeed: 1.6
  # Integração com AuraSkills (os valores são aplicados via plugin ou lore)
  # Requisito mínimo de atributo pode ser feito via AuraSkills ou script

# ------------------------------
# ELMO DO GUARDIÃO CORROMPIDO
