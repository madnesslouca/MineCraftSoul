# ============================================================
# GUARDIÃO CORROMPIDO — Boss Principal Tier 1 (ARQUIVO DE MOBS)
# Catacumbas do Véu Rasgado — Andar 3 (Arena Circular com pilares)
# ------------------------------------------------------------
# Balanceado para: grupo de 4 jogadores, nível 15~25.
#
# No servidor:
#   - Este arquivo vai em:      plugins/MythicMobs/Mobs/
#   - As metaskills ficam em:   plugins/MythicMobs/Skills/
#     (ver configs/mythicmobs/skills/guardiao-corrompido-skills.yml)
# O MythicMobs NÃO carrega metaskills definidas dentro de arquivo de mob —
# por isso a separação.
#
# ATENÇÃO: o ID interno mudou de "GuardiãoCorrompido" para
# "GuardiaoCorrompido" (sem acento). IDs internos com caractere especial
# quebram comandos, placeholders e integrações em vários setups.
# Spawn manual: /mm mobs spawn GuardiaoCorrompido <mundo>,<x>,<y>,<z>
# ============================================================

GuardiaoCorrompido:
  Type: WITHER_SKELETON
  Display: '&5&lGuardião Corrompido'
# TUNING BRUTAL: mesmo com 4 jogadores nv 15~25 a luta deve ser MUITO difícil.
  # Wipe nas primeiras tentativas é o esperado — o boss é um "muro" que
  # empurra o grupo a upar, explorar e voltar mais forte (filosofia Souls).
  Health: 12000         # ~5 a 7 min de luta p/ grupo coordenado (principal knob de tuning)
  Damage: 22            # dano do auto-attack melee da IA (dói até no tanque)
  Armor: 16
  MovementSpeed: 0.28
  Faction: Corrompidos  # mesma facção dos adds -> o boss nunca agride as próprias invocações
  BossBar:
    Enabled: true
    Title: '&5&l☠ Guardião Corrompido ☠'
    Range: 60
    Color: PURPLE
    Style: SOLID
  Options:
    AlwaysShowName: true
    Despawn: false            # o boss não some se o grupo morrer/deslogar
    KnockbackResistance: 1.0  # boss Souls-like não pode tomar stunlock de knockback
    PreventOtherDrops: true
    PreventRandomEquipment: true
    Silent: false
    Collidable: true
    FollowRange: 48
  Modules:
    ThreatTable: true         # aggro por ameaça -> um "tanque" consegue segurar o boss
  DamageModifiers:
    # Anti-cheese (Souls-like): o boss não morre para táticas degeneradas
    - PROJECTILE 0.6          # ranged continua viável, mas não trivializa
    - FALL 0
    - DROWNING 0
    - SUFFOCATION 0
    - FIRE 0
    - FIRE_TICK 0
    - LAVA 0
    - POISON 0
    - WITHER 0
  AIGoalSelectors:
    - clear
    - meleeattack
  AITargetSelectors:
    - clear
    - players               # "mythicmobs" foi removido: fazia o boss atacar os próprios adds

  Skills:
    # ---------------- SETUP / CONTROLE DE FASE ----------------
    # Fases controladas por variável (padrão moderno do MythicMobs):
    #   fase 1 = 100~60% HP | fase 2 = 60~30% HP | fase 3 = <30% HP
    - setvariable{var=caster.fase;value=1;type=INTEGER} @self ~onSpawn
    - skill{s=GC_Intro} @self ~onSpawn

    # Transições disparam UMA única vez (guardadas pela variável de fase)
    # healthPercent{h=<X}: condição correta para % de vida (h= aceita <, >, =)
    - skill{s=GC_TransicaoFase2} @self ~onDamaged ?varequals{var=caster.fase;value=1} ?healthPercent{h=<60}
    - skill{s=GC_TransicaoFase3} @self ~onDamaged ?varequals{var=caster.fase;value=2} ?healthPercent{h=<30}

    # ---------------- ROTAÇÃO BASE (todas as fases) ----------------
    # ?!varequals{var=caster.ocupado;value=1} funciona como "GCD": o boss não
    # inicia um ataque grande enquanto outro cast está em andamento.
    # (a variável "ocupado" é setada com duration e expira sozinha)
    # playerwithin{r=}: checa se há jogador no raio do boss (parâmetro correto: r=, não d=)
    # targetwithin{r=}: checa distância ao alvo atual (parâmetro correto: r=, não d=)
    - skill{s=GC_GolpePesado} @self ~onTimer:120 ?playerwithin{r=24} ?!varequals{var=caster.ocupado;value=1}
    - skill{s=GC_ComboTriplo} @self ~onTimer:160 ?targetwithin{r=5} ?!varequals{var=caster.ocupado;value=1}
    - skill{s=GC_Agarrao} @self ~onTimer:240 ?targetwithin{r=3} ?!varequals{var=caster.ocupado;value=1}
    # Represália: chance de contra-ataque instantâneo ao ser golpeado de perto.
    # Pune quem só aperta botão colado no boss sem respeitar o moveset.
    - skill{s=GC_Represalia} @self ~onDamaged 0.12 ?targetwithin{r=4} ?!varequals{var=caster.ocupado;value=1}

    # ---------------- FASE 1 ----------------
    # Cap de 4 adds vivos: parâmetros corretos do mobsinradius: m= a= r= (não types/amount/radius)
    - skill{s=GC_InvocarAlmas} @self ~onTimer:340 ?varequals{var=caster.fase;value=1} ?mobsinradius{m=AlmaCorrompida;a=<5;r=40}

    # ---------------- FASE 2+ (fase != 1) ----------------
    - skill{s=GC_ProjetilAlma} @self ~onTimer:160 ?!varequals{var=caster.fase;value=1} ?playerwithin{r=30} ?!varequals{var=caster.ocupado;value=1}
    - skill{s=GC_ErupcaoAlmas} @self ~onTimer:280 ?!varequals{var=caster.fase;value=1} ?playerwithin{r=10} ?!varequals{var=caster.ocupado;value=1}
    - skill{s=GC_RaioDoVeu} @self ~onTimer:380 ?!varequals{var=caster.fase;value=1} ?playerwithin{r=40} ?!varequals{var=caster.ocupado;value=1}
    - skill{s=GC_ChuvaDeAlmas} @self ~onTimer:400 ?varequals{var=caster.fase;value=2}

    # ---------------- FASE 3 ----------------
    - skill{s=GC_ChuvaDeAlmas} @self ~onTimer:240 ?varequals{var=caster.fase;value=3}
    - skill{s=GC_InvestidaFuriosa} @self ~onTimer:200 ?varequals{var=caster.fase;value=3} ?!varequals{var=caster.ocupado;value=1}
    - skill{s=GC_TempestadeAlmas} @self ~onTimer:600 ?varequals{var=caster.fase;value=3} ?!varequals{var=caster.ocupado;value=1}

    # ---------------- MORTE ----------------
    - skill{s=GC_Morte} @self ~onDeath

  Drops:
    # Sintaxe MythicMobs: <drop> <quantidade> <chance>
    # Ajuste o namespace/case dos itens para o do pack final do ItemsAdder.
    - itemsadder{item=minecraftsoul:LaminaVeuCorrompido} 1 0.35
    - itemsadder{item=minecraftsoul:ElmoGuardiaoCorrompido} 1 0.40
    - itemsadder{item=minecraftsoul:AnelAlmaPresa} 1 0.25
    - itemsadder{item=minecraftsoul:FragmentoVeuRasgado} 1to3 0.80
    - exp 350 1

# ============================================================
# MOBS SECUNDÁRIOS
# ============================================================

# Add da Fase 1: fraco individualmente, mas aplica Lentidão ao acertar —
# ignorá-lo custa mobilidade, que é vida num boss Souls-like.
AlmaCorrompida:
  Type: ZOMBIE
  Display: '&7Alma Corrompida'
  Health: 90
  Damage: 10
  MovementSpeed: 0.32
  Faction: Corrompidos
  Options:
    Silent: true
    Despawn: true
    PreventOtherDrops: true
    PreventRandomEquipment: true
  AIGoalSelectors:
    - clear
    - meleeattack
  AITargetSelectors:
    - clear
    - players
  Skills:
    - potion{type=SLOWNESS;duration=60;level=1} @trigger ~onAttack
    - effect:particles{p=soul;amount=8;speed=0.05} @trigger ~onAttack
    - remove @self ~onSignal:GC_BOSS_MORTO

# Mini-boss da Fase 3: entra junto com a transição, dividindo a atenção do grupo.
EcoGuardiao:
  Type: WITHER_SKELETON
  Display: '&5Eco do Guardião'
  Health: 1600
  Damage: 18
  Armor: 10
  MovementSpeed: 0.31
  Faction: Corrompidos
  Options:
    Despawn: true
    KnockbackResistance: 0.6
    PreventOtherDrops: true
    PreventRandomEquipment: true
  AIGoalSelectors:
    - clear
    - meleeattack
  AITargetSelectors:
    - clear
    - players
  Skills:
    - skill{s=GC_EcoGolpe} @self ~onTimer:120 ?targetwithin{d=4}
    - remove @self ~onSignal:GC_BOSS_MORTO

# Mob-marcador invisível da mecânica "Chuva de Almas" (Fase 2+).
# Todo o ciclo de vida dele (telegraph -> erupção -> poça -> remoção)
# está na metaskill GC_Zona_Ciclo.
GC_ZonaCorrompida:
  Type: ARMOR_STAND
  Display: '&8Zona Corrompida'
  Health: 1
  Faction: Corrompidos
  Options:
    Invisible: true
    Marker: true
    Invincible: true
    Silent: true
    Collidable: false
    Despawn: true
  Skills:
    - skill{s=GC_Zona_Ciclo} @self ~onSpawn
    - remove @self ~onSignal:GC_BOSS_MORTO

# ============================================================
# Depois de copiar para o servidor: /mm reload
# ============================================================
