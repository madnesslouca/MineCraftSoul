# Guardião Corrompido - Boss Principal Tier 1
# Catacumbas do Véu Rasgado - Andar 3

GuardiãoCorrompido:
  Type: WITHER_SKELETON
  Display: '&5&lGuardião Corrompido'
  Health: 950
  Damage: 28
  Armor: 18
  MovementSpeed: 0.25
  PreventOtherDrops: true
  PreventRandomEquipment: true
  Options:
    AlwaysShowName: true
    Silent: false
    Collidable: true
  AIGoalSelectors:
    - clear
    - melee
  AITargetSelectors:
    - clear
    - players
    - mythicmobs

  Skills:
    # ==================== FASE 1 (100% ~ 60% HP) ====================
    - skill{GolpePesado} @Self ~onTimer:180
    - skill{ComboTriplo} @Self ~onTimer:220
    - skill{InvocarAlmas} @Self ~onTimer:300 ~condition{HealthAbove 60}

    # ==================== FASE 2 (60% ~ 30% HP) ====================
    - skill{ProjetilAlma} @Self ~onTimer:160 ~condition{HealthBelow 60}
    - skill{ErupcaoAlmas} @Self ~onTimer:280 ~condition{HealthBelow 60}
    - skill{DestruirPilar} @Self ~onTimer:400 ~condition{HealthBelow 60}

    # ==================== FASE 3 (< 30% HP) ====================
    - skill{InvestidaFuriosa} @Self ~onTimer:140 ~condition{HealthBelow 30}
    - skill{TempestadeAlmas} @Self ~onTimer:350 ~condition{HealthBelow 30}
    - skill{SummonFinal} @Self ~onTimer:500 ~condition{HealthBelow 30}

    # Transições de Fase (efeitos visuais e sonoros)
    - message{&cO Guardião desperta sua fúria...} @Self ~onHealthBelow 60
    - effect{ particles{type=SOUL, amount=80, speed=0.8} } @Self ~onHealthBelow 60
    - sound{entity.wither.death volume=1.2 pitch=0.7} @Self ~onHealthBelow 60

    - message{&4O Véu está rasgado!} @Self ~onHealthBelow 30
    - effect{ particles{type=CRIMSON_SPORE, amount=120, speed=1.2} } @Self ~onHealthBelow 30
    - sound{entity.ender_dragon.growl volume=1.5 pitch=0.6} @Self ~onHealthBelow 30

  # ==================== DEFINIÇÃO DAS SKILLS ====================

  GolpePesado:
    Skills:
      - delay 8
      - effect{ particles{type=SOUL_FIRE_FLAME, amount=30, speed=0.6} radius=2 } @Self
      - sound{entity.wither.hurt volume=0.9 pitch=0.8} @Self
      - delay 12
      - damage{amount=45; radius=3.5; type=PHYSICAL} @Forward{f=3.5; r=0}
      - push{velocity=1.8; y=0.4} @Forward{f=3.5; r=0}
      - effect{ particles{type=EXPLOSION, amount=15} radius=3.5 } @Forward{f=3.5; r=0}

  ComboTriplo:
    Skills:
      - damage{amount=22; radius=2.8} @Forward{f=2.5}
      - delay 8
      - damage{amount=24; radius=2.8} @Forward{f=2.5}
      - delay 9
      - damage{amount=38; radius=3.2; type=PHYSICAL} @Forward{f=2.8}
      - stun{duration=25} @Forward{f=2.8}
      - effect{ particles{type=CRIT, amount=25} radius=3 } @Forward{f=2.8}

  InvocarAlmas:
    Skills:
      - summon{type=AlmaCorrompida; amount=2; radius=4} @Self
      - summon{type=AlmaCorrompida; amount=1; radius=5} @Self
      - message{&7Almas corrompidas emergem do chão...} @Self
      - effect{ particles{type=SOUL, amount=60} radius=6 } @Self

  ProjetilAlma:
    Skills:
      - delay 6
      - effect{ particles{type=SOUL, amount=40, speed=1.2} radius=1.5 } @Self
      - sound{entity.ghast.shoot volume=0.8 pitch=1.1} @Self
      - delay 10
      - projectile{type=ender_pearl; speed=1.4; homing=false; amount=3; spread=25} @Forward{f=2}
      - damage{amount=32; type=MAGIC} @projectile
      - effect{ particles{type=SOUL_FIRE_FLAME, amount=15} } @projectile

  ErupcaoAlmas:
    Skills:
      - message{&5O Guardião canaliza energia sombria...} @Self
      - delay 25
      - effect{ particles{type=SOUL, amount=150, speed=1.5} radius=8 } @Self
      - sound{entity.wither.spawn volume=1.0 pitch=0.5} @Self
      - delay 8
      - damage{amount=55; radius=7; type=MAGIC} @Self
      - push{velocity=2.2; y=0.6} @Players{r=8}
      - effect{ particles{type=EXPLOSION_EMITTER, amount=30} radius=7 } @Self

  DestruirPilar:
    Skills:
      - message{&cUm pilar começa a ruir...} @Self
      - effect{ particles{type=BLOCK_CRACK, material=DEEPSLATE_BRICKS, amount=80} radius=4 } @RandomPlayer{r=12}
      # Nota: A destruição real do pilar deve ser feita via comando ou redstone manualmente
      # ou com um MythicMob separado no pilar

  InvestidaFuriosa:
    Skills:
      - message{&4O Guardião avança furioso!} @Self
      - effect{ particles{type=CRIMSON_SPORE, amount=50} radius=2 } @Self
      - delay 6
      - damage{amount=48; radius=2.5} @Forward{f=8}
      - push{velocity=3.5; y=0.3} @Forward{f=8}
      - effect{ particles{type=SWEEP_ATTACK, amount=20} radius=3 } @Forward{f=8}

  TempestadeAlmas:
    Skills:
      - message{&4&lTEMPESTADE DE ALMAS! Encontrem cobertura!} @Self
      - delay 15
      - effect{ particles{type=SOUL_FIRE_FLAME, amount=200, speed=2} radius=10 } @Self
      - sound{entity.ender_dragon.growl volume=1.8 pitch=0.4} @Self
      - delay 35
      - damage{amount=75; radius=9; type=MAGIC} @Self
      - effect{ particles{type=EXPLOSION, amount=60} radius=9 } @Self
      - push{velocity=2.8; y=0.8} @Players{r=9}

  SummonFinal:
    Skills:
      - summon{type=EcoGuardiao; amount=1; radius=3} @Self
      - message{&cUm Eco do Guardião surge!} @Self
      - effect{ particles{type=SOUL, amount=100} radius=5 } @Self

# ==================== MOBS SECUNDÁRIOS ====================

AlmaCorrompida:
  Type: ZOMBIE
  Display: '&7Alma Corrompida'
  Health: 45
  Damage: 12
  Options:
    Silent: true
  Skills:
    - skill{AlmaAttack} @Self ~onTimer:60

AlmaAttack:
  Skills:
    - damage{amount=14} @Forward{f=1.5}
    - effect{ particles{type=SOUL, amount=12} radius=1.5 } @Forward{f=1.5}

EcoGuardiao:
  Type: WITHER_SKELETON
  Display: '&5Eco do Guardião'
  Health: 280
  Damage: 22
  Armor: 12
  Skills:
    - skill{EcoGolpe} @Self ~onTimer:120

EcoGolpe:
  Skills:
    - damage{amount=35; radius=3} @Forward{f=2.5}
    - effect{ particles{type=SOUL_FIRE_FLAME, amount=25} radius=3 } @Forward{f=2.5}
    - push{velocity=1.5; y=0.2} @Forward{f=2.5}

# Fim do arquivo
# Dica: Use /mm reload depois de colocar no servidor
# Para spawn manual: /mm spawn GuardiãoCorrompido <world> <x> <y> <z>