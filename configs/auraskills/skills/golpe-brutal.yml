# ============================================
# GOLPE BRUTAL - Skill Combinada (Balanceada D.1)
# Escala com: Força + Destreza
# ============================================

skill:
  id: golpe-brutal
  name: "&cGolpe Brutal"
  description:
    - "&7Um golpe poderoso que combina força bruta com precisão."
    - "&7Causa alto dano físico baseado em Força + Destreza."
    - "&7Pequena chance de atordoar o alvo."
    - "&8Requer: &cForça 10+"

  max-level: 20
  enabled: true

  # Custo e Cooldown (balanceado)
  mana-cost: "12 + (level * 1.2)"
  cooldown: "(9 - (level * 0.25)) * 20"   # ~9s no lvl 1 → ~4s no lvl 20

  level-requirement: 5

  triggers:
    - type: left_click
      conditions:
        - type: has_item_in_hand
          material: DIAMOND_SWORD, NETHERITE_SWORD, IRON_SWORD

  effects:
    - type: damage
      value: "(player_strength * 2.4) + (player_dexterity * 1.3) + (level * 3.5)"
      damage-type: PHYSICAL
      
    - type: potion_effect
      effect: SLOW
      duration: "(level * 3) + 15"
      amplifier: 0
      chance: "(player_dexterity * 0.7) + 12"
      target: target

  messages:
    use: "&cVocê desfere um Golpe Brutal!"
    hit: "&7O golpe acertou com força devastadora!"

  requirements:
    strength: 10
