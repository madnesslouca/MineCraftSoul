# ============================================
# TIRO PRECISO - Skill Combinada (Balanceada D.1)
# Escala com: Destreza + Inteligência
# ============================================

skill:
  id: tiro-preciso
  name: "&bTiro Preciso"
  description:
    - "&7Dispara um projétil rápido e preciso."
    - "&7Alto dano + chance de crítico."
    - "&8Requer: &bDestreza 10+ &7e &dInteligência 8+"

  max-level: 20
  enabled: true

  mana-cost: "10 + (level * 1.3)"
  cooldown: "(7 - (level * 0.15)) * 20"

  level-requirement: 5

  triggers:
    - type: right_click
      conditions:
        - type: has_item_in_hand
          material: BOW, CROSSBOW

  effects:
    - type: damage
      value: "(player_dexterity * 2.6) + (player_intelligence * 1.2) + (level * 3)"
      damage-type: PHYSICAL
      
    - type: potion_effect
      effect: SLOW
      duration: 15
      amplifier: 0
      chance: "(player_dexterity * 0.5) + 10"
      target: target

  messages:
    use: "&bVocê dispara um Tiro Preciso!"

  requirements:
    dexterity: 10
    intelligence: 8
