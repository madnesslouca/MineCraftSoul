# ============================================
# ESCUDO ARCANO - Skill Combinada (Balanceada D.1)
# Escala com: Constituição + Inteligência
# ============================================

skill:
  id: escudo-arcano
  name: "&bEscudo Arcano"
  description:
    - "&7Cria um escudo mágico temporário."
    - "&7Absorve dano e reflete parte do ataque."
    - "&7Escala com Constituição (duração) + Inteligência (força do escudo)."
    - "&8Requer: &aConstituição 10+ &7e &dInteligência 8+"

  max-level: 15
  enabled: true

  mana-cost: "18 + (level * 2)"
  cooldown: "(22 - (level * 0.7)) * 20"

  level-requirement: 8

  triggers:
    - type: right_click
      conditions:
        - type: has_item_in_hand
          material: SHIELD, NETHERITE_SWORD

  effects:
    - type: potion_effect
      effect: ABSORPTION
      duration: "(level * 25) + 80"
      amplifier: "1 + (player_intelligence * 0.06)"
      target: self
      
    - type: damage
      value: "player_intelligence * 1.5"
      damage-type: MAGIC
      chance: 30
      target: attacker
      message: "&bSeu Escudo Arcano refletiu o ataque!"

  messages:
    use: "&bVocê conjura um Escudo Arcano!"

  requirements:
    constitution: 10
    intelligence: 8
