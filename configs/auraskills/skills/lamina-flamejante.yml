# ============================================
# LÂMINA FLAMEJANTE - Skill Combinada
# Escala com: Força + Inteligência
# ============================================

skill:
  id: lamina-flamejante
  name: "&6Lâmina Flamejante"
  description:
    - "&7Envolva sua arma em chamas arcanas."
    - "&7Causa dano físico + dano de fogo ao longo do tempo."
    - "&7Escala com Força (dano base) + Inteligência (poder mágico)."

  max-level: 20
  enabled: true

  mana-cost: "15 + (level * 2)"
  cooldown: "12 * 20"

  triggers:
    - type: left_click
      conditions:
        - type: has_item_in_hand
          material: DIAMOND_SWORD, NETHERITE_SWORD

  effects:
    # Dano inicial físico + mágico
    - type: damage
      value: "(player_strength * 2.2) + (player_intelligence * 1.8) + (level * 5)"
      damage-type: PHYSICAL

    # Dano de fogo por tempo (DoT)
    - type: damage_over_time
      value: "(player_intelligence * 0.9) + (level * 1.5)"
      damage-type: FIRE
      duration: "(level * 8) + 40"     # ticks
      interval: 20
      target: target

  messages:
    use: "&6Sua lâmina se envolve em chamas!"

  requirements:
    strength: 12
    intelligence: 10