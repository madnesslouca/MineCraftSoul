# ============================================
# LÂMINA FLAMEJANTE - Skill Combinada (Balanceada D.1)
# Escala com: Força + Inteligência
# ============================================

skill:
  id: lamina-flamejante
  name: "&6Lâmina Flamejante"
  description:
    - "&7Envolva sua arma em chamas arcanas."
    - "&7Causa dano físico + dano de fogo ao longo do tempo."
    - "&7Escala com Força (dano base) + Inteligência (poder mágico)."
    - "&8Requer: &cForça 8+ &7e &dInteligência 8+"

  max-level: 20
  enabled: true

  mana-cost: "14 + (level * 1.8)"
  cooldown: "11 * 20"

  level-requirement: 6

  triggers:
    - type: left_click
      conditions:
        - type: has_item_in_hand
          material: DIAMOND_SWORD, NETHERITE_SWORD

  effects:
    - type: damage
      value: "(player_strength * 2.0) + (player_intelligence * 1.6) + (level * 4)"
      damage-type: PHYSICAL

    - type: damage_over_time
      value: "(player_intelligence * 0.85) + (level * 1.3)"
      damage-type: FIRE
      duration: "(level * 6) + 30"
      interval: 20
      target: target

  messages:
    use: "&6Sua lâmina se envolve em chamas!"

  requirements:
    strength: 8
    intelligence: 8
