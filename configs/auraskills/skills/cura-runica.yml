# ============================================
# CURA RÚNICA - Skill Combinada (Balanceada D.1)
# Escala com: Sabedoria + Inteligência
# ============================================

skill:
  id: cura-runica
  name: "&aCura Rúnica"
  description:
    - "&7Cura o jogador e aliados próximos."
    - "&7Cura forte + regeneração ao longo do tempo."
    - "&8Requer: &dSabedoria 10+ &7e &dInteligência 8+"

  max-level: 15
  enabled: true

  mana-cost: "22 + (level * 2)"
  cooldown: "(20 - (level * 0.6)) * 20"

  level-requirement: 7

  triggers:
    - type: right_click
      conditions:
        - type: has_item_in_hand
          material: NETHERITE_SWORD, DIAMOND_SWORD, SHIELD

  effects:
    - type: heal
      value: "(player_wisdom * 2.2) + (player_intelligence * 1.4) + (level * 6)"
      target: self

    - type: potion_effect
      effect: REGENERATION
      duration: "(level * 20) + 60"
      amplifier: "level / 4"
      target: self

  messages:
    use: "&aVocê canaliza uma Cura Rúnica!"

  requirements:
    wisdom: 10
    intelligence: 8
