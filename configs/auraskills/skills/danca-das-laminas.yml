# ============================================
# DANÇA DAS LÂMINAS - Skill Combinada (Balanceada D.1)
# Escala com: Destreza + Força
# ============================================

skill:
  id: danca-das-laminas
  name: "&eDança das Lâminas"
  description:
    - "&7Gira rapidamente atacando todos ao redor."
    - "&7Multi-hit em área."
    - "&8Requer: &bDestreza 10+ &7e &cForça 8+"

  max-level: 18
  enabled: true

  mana-cost: "20 + (level * 1.4)"
  cooldown: "14 * 20"

  level-requirement: 9

  triggers:
    - type: left_click
      conditions:
        - type: has_item_in_hand
          material: DIAMOND_SWORD, NETHERITE_SWORD

  effects:
    - type: damage
      value: "(player_dexterity * 1.6) + (player_strength * 1.8) + (level * 2.8)"
      damage-type: PHYSICAL
      radius: "3.5"

  messages:
    use: "&eVocê executa a Dança das Lâminas!"

  requirements:
    dexterity: 10
    strength: 8
