# ============================================
# INVESTIDA BRUTAL - Skill Combinada (Balanceada D.1)
# Escala com: Constituição + Força
# ============================================

skill:
  id: investida-brutal
  name: "&4Investida Brutal"
  description:
    - "&7Avança rapidamente contra o inimigo."
    - "&7Causa dano e empurra o alvo, ganhando vida temporária."
    - "&8Requer: &aConstituição 12+ &7e &cForça 10+"

  max-level: 15
  enabled: true

  mana-cost: "18 + (level * 1.2)"
  cooldown: "16 * 20"

  level-requirement: 8

  triggers:
    - type: left_click
      conditions:
        - type: has_item_in_hand
          material: NETHERITE_AXE, DIAMOND_AXE, IRON_AXE

  effects:
    - type: dash
      distance: "2.5 + (level * 0.12)"
      speed: 1.7

    - type: damage
      value: "(player_constitution * 1.4) + (player_strength * 2.2) + (level * 5)"
      damage-type: PHYSICAL
      target: target

    - type: heal
      value: "player_constitution * 0.7"
      target: self

    - type: potion_effect
      effect: ABSORPTION
      duration: "(level * 8) + 40"
      amplifier: "level / 5"
      target: self

  messages:
    use: "&4Você avança com uma Investida Brutal!"

  requirements:
    constitution: 12
    strength: 10
