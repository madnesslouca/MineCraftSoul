# ============================================
# RAJADA ARCANA - Skill Combinada (Balanceada D.1)
# Escala com: Destreza + Inteligência
# ============================================

skill:
  id: rajada-arcana
  name: "&dRajada Arcana"
  description:
    - "&7Dispara uma rajada de energia arcana."
    - "&7Causa dano mágico + chance de lentidão."
    - "&8Requer: &bDestreza 8+ &7e &dInteligência 10+"

  max-level: 20
  enabled: true

  mana-cost: "13 + (level * 1.6)"
  cooldown: "(8 - (level * 0.2)) * 20"

  level-requirement: 6

  triggers:
    - type: right_click
      conditions:
        - type: has_item_in_hand
          material: BOW, CROSSBOW

  effects:
    - type: damage
      value: "(player_dexterity * 1.8) + (player_intelligence * 2.0) + (level * 3.5)"
      damage-type: MAGIC

    - type: potion_effect
      effect: SLOW
      duration: "(level * 4) + 20"
      amplifier: 1
      chance: "(player_intelligence * 0.6) + 18"
      target: target

  messages:
    use: "&dVocê dispara uma Rajada Arcana!"

  requirements:
    dexterity: 8
    intelligence: 10
