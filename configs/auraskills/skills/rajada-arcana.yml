# ============================================
# RAJADA ARCANA - Skill Combinada
# Escala com: Destreza + Inteligência
# ============================================

skill:
  id: rajada-arcana
  name: "&dRajada Arcana"
  description:
    - "&7Dispara uma rajada de energia arcana."
    - "&7Causa dano mágico + chance de lentidão."
    - "&7Excelente para builds híbridas de ranged + mágico."

  max-level: 20
  enabled: true

  mana-cost: "12 + (level * 1.8)"
  cooldown: "(6 - (level * 0.15)) * 20"

  triggers:
    - type: left_click
      conditions:
        - type: has_item_in_hand
          material: BOW, CROSSBOW, TRIDENT

  effects:
    - type: projectile
      damage: "(player_dexterity * 2.2) + (player_intelligence * 2.0) + (level * 4)"
      damage-type: MAGIC
      speed: 2.5
      
    - type: potion_effect
      effect: SLOW
      duration: "(level * 8) + 30"
      amplifier: 1
      chance: "(player_dexterity * 0.7) + 20"
      target: target

  messages:
    use: "&dVocê dispara uma Rajada Arcana!"
    hit: "&7A energia arcana atinge o alvo!"

  requirements:
    dexterity: 12
    intelligence: 12
