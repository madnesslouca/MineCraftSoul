# ============================================
# GOLPE SÍSMICO - Skill Combinada
# Escala com: Força + Constituição
# ============================================

skill:
  id: golpe-sismico
  name: "&6Golpe Sísmico"
  description:
    - "&7Um golpe pesado que faz o chão tremer."
    - "&7Causa dano em área baseado em Força + Constituição."
    - "&7Empurra inimigos próximos para trás."

  max-level: 20
  enabled: true

  mana-cost: "15 + (level * 2)"
  cooldown: "(12 - (level * 0.3)) * 20"

  triggers:
    - type: left_click
      conditions:
        - type: has_item_in_hand
          material: NETHERITE_AXE, DIAMOND_AXE, IRON_AXE, STONE_AXE

  effects:
    - type: damage
      value: "(player_strength * 3.2) + (player_constitution * 1.6) + (level * 5)"
      damage-type: PHYSICAL
      radius: "2 + (level * 0.1)"
      
    - type: knockback
      strength: "1.5 + (player_constitution * 0.05)"
      radius: "3 + (level * 0.15)"

  messages:
    use: "&6O chão treme com seu Golpe Sísmico!"
    hit: "&7Inimigos são lançados para longe!"

  requirements:
    strength: 20
