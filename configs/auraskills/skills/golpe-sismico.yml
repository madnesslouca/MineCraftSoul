# ============================================
# GOLPE SÍSMICO - Skill Combinada (Balanceada D.1)
# Escala com: Força + Constituição
# ============================================

skill:
  id: golpe-sismico
  name: "&6Golpe Sísmico"
  description:
    - "&7Um golpe pesado que faz o chão tremer."
    - "&7Causa dano em área baseado em Força + Constituição."
    - "&7Empurra inimigos próximos para trás."
    - "&8Requer: &cForça 12+"

  max-level: 20
  enabled: true

  mana-cost: "16 + (level * 1.5)"
  cooldown: "(13 - (level * 0.35)) * 20"

  level-requirement: 7

  triggers:
    - type: left_click
      conditions:
        - type: has_item_in_hand
          material: NETHERITE_AXE, DIAMOND_AXE, IRON_AXE, STONE_AXE

  effects:
    - type: damage
      value: "(player_strength * 2.8) + (player_constitution * 1.5) + (level * 4)"
      damage-type: PHYSICAL
      radius: "2.2 + (level * 0.08)"
      
    - type: knockback
      strength: "1.3 + (player_constitution * 0.04)"
      radius: "2.8 + (level * 0.12)"

  messages:
    use: "&6O chão treme com seu Golpe Sísmico!"
    hit: "&7Inimigos são lançados para longe!"

  requirements:
    strength: 12
