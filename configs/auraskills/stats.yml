stats:
  forca:
    display-name: "&cForça"
    description: "Aumenta o dano físico melee e a capacidade de carregar itens pesados."
    icon: "IRON_SWORD"
    color: "&c"

  constituicao:
    display-name: "&aConstituição"
    description: "Aumenta a vida máxima e a regeneração de vida."
    icon: "GOLDEN_APPLE"
