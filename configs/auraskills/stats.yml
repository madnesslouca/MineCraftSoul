  inteligencia:
    display-name: "&dInteligência"
    description: "Aumenta dano mágico, mana máxima e potência de skills."
    icon: "ENCHANTED_BOOK"
    color: "&d"

  sabedoria:
    display-name: "&eSabedoria"
    description: "Aumenta resistência mágica, cura e regeneração de mana."
    icon: "EXPERIENCE_BOTTLE"
    color: "&e"

